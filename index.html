<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>77 Bookmarks</title>
    <script>
      // Apply the theme and style preset before first paint to avoid a flash
      ;(function () {
        var theme = localStorage.getItem('theme')
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        var style = localStorage.getItem('style')
        document.documentElement.dataset.style =
          style === 'paper' || style === 'linear' || style === 'swiss' || style === 'brutalist' ? style : 'paper'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
