<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>77 Bookmarks 扩展选项</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="options">
    <header class="brand">
      <img src="icons/icon-48.png" alt="" />
      <h1>77 Bookmarks 扩展</h1>
    </header>

    <section id="connected" hidden>
      <h2>已连接到 <span id="site-name"></span></h2>
      <p class="server" id="server"></p>
      <div class="row">
        <button id="open">打开书签页</button>
        <button id="disconnect">断开连接</button>
      </div>
    </section>

    <section id="connect" hidden>
      <h2>连接书签页</h2>
      <p class="muted">在书签页打开「更多 → 系统设置 → 浏览器扩展」，生成连接码并粘贴到这里。连接码包含书签页的地址和访问令牌，只保存在这个浏览器里。</p>
      <form class="row" id="connect-form">
        <input id="code" placeholder="https://你的书签页/#bm_…" autocomplete="off" spellcheck="false" required aria-label="连接码" />
        <button class="primary" id="connect-button">连接</button>
      </form>
      <p class="error" id="error" role="alert" style="margin-top: 8px"></p>
    </section>

    <section>
      <h2>怎么用</h2>
      <ol>
        <li>在任意网页的空白处点右键，选择「添加当前网页到 77 Bookmarks」。</li>
        <li>在链接上点右键，选择「添加此链接到 77 Bookmarks」，添加的是链接指向的地址。</li>
        <li>点击工具栏上的扩展图标，可以先选好桌面和分组再添加；右键菜单和快捷键会沿用这次的选择。</li>
        <li>快捷键默认是 <kbd>Alt+Shift+B</kbd>，可以在 <button class="link" id="shortcuts">扩展快捷键设置</button> 里修改。</li>
      </ol>
    </section>
    <script type="module" src="options.js"></script>
  </body>
</html>
