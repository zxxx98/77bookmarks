<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>77 Bookmarks 右键添加 — 设置</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f4ef;
      --surface: #fffdf9;
      --surface-2: #efece4;
      --ink: #24221d;
      --muted: #6c675d;
      --line: #e2ddd2;
      --accent: #3b6956;
      --accent-ink: #ffffff;
      --danger: #b3402f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181714;
        --surface: #211f1b;
        --surface-2: #2a2823;
        --ink: #efede8;
        --muted: #a6a095;
        --line: #34312b;
        --accent: #528871;
        --danger: #dc6b59;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      font: 14px/1.6 system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    main {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    section { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      font: inherit;
    }
    input.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      height: 38px;
      padding: 0 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .primary { background: var(--accent); color: var(--accent-ink); }
    .soft { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
    .connected-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--surface-2);
      font-size: 13px;
    }
    .origin { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; }
    .status { min-height: 20px; margin: 14px 0 0; font-size: 13px; color: var(--accent); }
    .status.error { color: var(--danger); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1 id="site-title">77 Bookmarks 右键添加</h1>
    <p class="sub">在任意网页或链接上点右键，就能保存到你的书签服务器。</p>

    <section id="connect-section">
      <form id="connect-form">
        <label for="code">连接码（在自部署版的「设置 → 浏览器插件」生成）</label>
        <div class="row">
          <input id="code" class="mono" type="text" placeholder="https://你的地址/#bm_..." autocomplete="off" spellcheck="false" />
          <button id="connect-btn" class="primary" type="submit">连接</button>
        </div>
      </form>
    </section>

    <section id="connected-section" class="hidden">
      <div class="connected-box">
        <div>
          <div>已连接</div>
          <div id="connected-origin" class="origin"></div>
        </div>
        <button id="disconnect-btn" class="soft" type="button">断开</button>
      </div>
    </section>

    <section id="target-section" class="hidden">
      <div class="grid">
        <div>
          <label for="desktop">默认桌面</label>
          <select id="desktop"></select>
        </div>
        <div>
          <label for="group">默认分组</label>
          <select id="group"></select>
        </div>
      </div>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>
  <script type="module" src="./options.js"></script>
</body>
</html>
